[build]
builder = "DOCKERFILE"
dockerfilePath = "deployment/docker/backend.Dockerfile"

[deploy]
startCommand = "sh -c 'alembic upgrade head && python scripts/seed_database.py && python scripts/create_admin.py && python scripts/demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
