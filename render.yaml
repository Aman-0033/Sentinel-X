version: "1"

services:
  - type: web
    name: sentinel-x-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: sentinel-x/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && python ../scripts/seed_database.py && python ../scripts/create_admin.py && python ../scripts/demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOW_SQLITE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./sentinel_x.db
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: MODEL_SIGNING_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: web
    name: sentinel-x-frontend
    runtime: static
    plan: free
    rootDir: sentinel-x/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sentinel-x-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: sentinel-x-backend
          property: host
