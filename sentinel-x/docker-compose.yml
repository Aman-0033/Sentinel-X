services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_x}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_x}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net

  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_dev_secret_change_me}@postgres:5432/${POSTGRES_DB:-sentinel_x}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-insecure_dev_jwt_secret_must_be_at_least_32_characters_long}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-insecure_dev_jwt_refresh_secret_at_least_32_chars_long}
      - ADMIN_BOOTSTRAP_SECRET=${ADMIN_BOOTSTRAP_SECRET:-insecure_dev_admin_bootstrap_secret_32_chars}
      - MODEL_SIGNING_KEY=${MODEL_SIGNING_KEY:-insecure_dev_model_signing_key_at_least_32_chars}
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - sentinel_net

  celery_worker:
    build:
      context: .
      dockerfile: deployment/docker/worker.Dockerfile
    container_name: sentinel_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_dev_secret_change_me}@postgres:5432/${POSTGRES_DB:-sentinel_x}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-insecure_dev_jwt_secret_must_be_at_least_32_characters_long}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-insecure_dev_jwt_refresh_secret_at_least_32_chars_long}
      - ADMIN_BOOTSTRAP_SECRET=${ADMIN_BOOTSTRAP_SECRET:-insecure_dev_admin_bootstrap_secret_32_chars}
      - MODEL_SIGNING_KEY=${MODEL_SIGNING_KEY:-insecure_dev_model_signing_key_at_least_32_chars}
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - sentinel_net

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    networks:
      - sentinel_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sentinel_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sentinel_net

volumes:
  postgres_data:
  redis_data:

networks:
  sentinel_net:
    driver: bridge

